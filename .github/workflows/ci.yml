name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        optional: [included, omitted]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: node scripts/verify-frozen-evidence.mjs
      - run: node scripts/verify-vulnerability-evidence.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - if: matrix.optional == 'included'
        run: npm run test:quality
      - if: matrix.optional == 'omitted'
        run: npm test
      - run: npm run test:e2e
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ matrix.optional }}
          include-hidden-files: true
          path: |
            .cache/coverage-combined
            .cache/quality
            .cache/e2e-report
            test-results
      - if: matrix.optional == 'omitted'
        run: npm ci --omit=dev --omit=optional --ignore-scripts
      - if: matrix.optional == 'omitted'
        run: node tests/optional-smoke.mjs
      - run: npm audit --omit=dev --audit-level=high
